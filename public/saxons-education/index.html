const passwordField = document.getElementById('password');
const showButton = document.getElementById('show-password');
showButton.addEventListener('click',()=>{const show=passwordField.type==='password';passwordField.type=show?'text':'password';showButton.textContent=show?'Hide':'Show';showButton.setAttribute('aria-pressed',String(show));showButton.setAttribute('aria-label',show?'Hide password':'Show password');});
document.getElementById('unlock-form').addEventListener('submit',async event=>{
  event.preventDefault();
  const status=document.getElementById('status'), button=document.getElementById('unlock');
  if(!globalThis.crypto?.subtle){status.textContent='Open this page in a current browser using its secure website link.';return;}
  const password=passwordField.value;
  button.disabled=true;button.textContent='Unlocking…';status.textContent='';
  try{
    const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encryptedReport.salt),iterations:encryptedReport.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(encryptedReport.iv),tagLength:128},key,bytes(encryptedReport.ciphertext));
    passwordField.value='';
    const report=new TextDecoder().decode(clear);
    document.open();document.write(report);document.close();
  }catch{
    status.textContent='The password wasn’t recognised. Please try again.';
    button.disabled=false;button.textContent='Unlock report ↗';passwordField.focus();
  }
});
